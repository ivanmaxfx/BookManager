services:
  postgres:
    image: postgres:16-alpine
    container_name: bookmanager-postgres
    environment:
      POSTGRES_DB: eventapi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bookmanager_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d eventapi
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bookmanager_postgres_data:
